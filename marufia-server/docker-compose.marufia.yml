# Camada Marufia sobre a distribuicao oficial. Requer Docker Compose >= 2.24.4.
services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  auth:
    environment:
      GOTRUE_JWT_KEYS: "${JWT_KEYS}"
      # Resend pode ocasionalmente ultrapassar o limite upstream de 10s ao
      # entregar mensagens. O gateway público permanece limitado a 60s.
      GOTRUE_API_MAX_REQUEST_DURATION: "${AUTH_MAX_REQUEST_DURATION:-30s}"
      GOTRUE_MAILER_EXTERNAL_HOSTS: "${AUTH_MAILER_EXTERNAL_HOSTS:-}"

  # PostgREST 16 remove a repeticao automatica e ilimitada de conflitos 40001.
  # O aplicativo usa esse codigo para detectar edicoes concorrentes da ficha.
  rest:
    image: postgrest/postgrest:v16.1

  realtime:
    environment:
      API_JWT_JWKS: "${JWT_JWKS}"

  storage:
    environment:
      JWT_JWKS: "${JWT_JWKS}"

  functions:
    profiles:
      - edge-functions
    environment:
      SUPABASE_JWKS: "${JWT_JWKS}"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432/tcp"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6543}:6543/tcp"
