services:
  marufia-public-gateway:
    container_name: marufia-public-gateway
    image: envoyproxy/envoy:v1.39.0
    restart: unless-stopped
    user: "101:101"
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "marufia-public-gateway"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api-gw:
        condition: service_healthy
    volumes:
      - ../../cloudflare/public-gateway-envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      default: {}
      marufia-tunnel:
        aliases:
          - marufia-public-gateway

  marufia-tunnel-smoke-gateway:
    container_name: marufia-tunnel-smoke-gateway
    image: envoyproxy/envoy:v1.39.0
    profiles:
      - quick-tunnel
    restart: "no"
    user: "101:101"
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "marufia-tunnel-smoke-gateway"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api-gw:
        condition: service_healthy
    volumes:
      - ../../cloudflare/smoke-gateway-envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      default: {}
      marufia-tunnel:
        aliases:
          - marufia-tunnel-smoke-gateway

  cloudflared:
    container_name: marufia-cloudflared
    image: cloudflare/cloudflared:2026.7.2
    profiles:
      - named-tunnel
    restart: unless-stopped
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      marufia-public-gateway:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    networks:
      - marufia-tunnel

  cloudflared-quick:
    container_name: marufia-cloudflared-quick
    image: cloudflare/cloudflared:2026.7.2
    profiles:
      - quick-tunnel
    restart: "no"
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - --no-autoupdate
      - --url
      - http://marufia-tunnel-smoke-gateway:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      marufia-tunnel-smoke-gateway:
        condition: service_healthy
    networks:
      - marufia-tunnel

networks:
  marufia-tunnel:
    name: marufia-server-tunnel

secrets:
  cloudflare_tunnel_token:
    file: ../../cloudflare/tunnel-token.token
