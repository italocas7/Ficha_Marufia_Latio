admin:
  access_log_path: /tmp/envoy-admin.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: marufia_smoke_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: marufia_tunnel_smoke_gateway
                codec_type: AUTO
                stream_idle_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: marufia_smoke_routes
                  virtual_hosts:
                    - name: marufia_smoke_api
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/auth/v1/health"
                            headers:
                              - name: ":method"
                                string_match: { exact: "GET" }
                          route: { cluster: supabase_api, timeout: 15s }
                        - match: { prefix: "/realtime/v1/" }
                          route: { cluster: supabase_api, timeout: 0s }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"message":"Rota bloqueada no ensaio temporário."}'
                          response_headers_to_add:
                            - header: { key: content-type, value: application/json }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: supabase_api
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: supabase_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api-gw
                      port_value: 8000
