admin:
  access_log_path: /tmp/envoy-admin.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: marufia_public_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: marufia_public_gateway
                codec_type: AUTO
                stream_idle_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: marufia_public_routes
                  virtual_hosts:
                    - name: marufia_public_api
                      domains: ["*"]
                      response_headers_to_remove:
                        - access-control-allow-origin
                        - access-control-allow-methods
                        - access-control-allow-headers
                        - access-control-expose-headers
                        - access-control-allow-credentials
                        - access-control-max-age
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
__MARUFIA_CORS_ORIGIN_MATCHERS__
                          allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
                          allow_headers: "authorization,apikey,content-type,x-client-info,x-supabase-api-version,accept-profile,content-profile,prefer,range"
                          expose_headers: "content-range,location,x-supabase-api-version"
                          max_age: "3600"
                          allow_credentials: false
                          forward_not_matching_preflights: false
                      routes:
                        - match: { prefix: "/auth/v1/" }
                          route: { cluster: supabase_api, timeout: 60s }
                        - match: { prefix: "/rest/v1/" }
                          route: { cluster: supabase_api, timeout: 60s }
                        - match: { prefix: "/realtime/v1/" }
                          route: { cluster: supabase_api, timeout: 0s }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"message":"Rota pública não disponível."}'
                          response_headers_to_add:
                            - header: { key: content-type, value: application/json }
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: supabase_api
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: supabase_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api-gw
                      port_value: 8000
