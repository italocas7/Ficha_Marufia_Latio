name: Publicar ficha no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Construir a ficha para publicação
        run: pnpm build:site

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a ficha construída
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
